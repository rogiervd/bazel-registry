# tooling_demo_cpp's tests live under test/tooling_demo_cpp and reference the module
# directly (e.g. "//:tooling_demo_cpp"), so they test the module's own root workspace
# in place rather than through a separate bzlmod test module.
matrix:
  platform: ["ubuntu1604", "macos"]
  bazel: [9.x]
tasks:
  run_tests:
    name: "Run unit tests"
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    test_targets:
      - "//test/..."
